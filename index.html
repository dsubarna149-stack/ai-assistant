<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Chat - By Soumik</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div class="container">
        <div id="login-section" class="screen active">
            <h2 style="color: #60a5fa;">Secret Chat Room</h2>
            <p style="margin-bottom: 20px; font-size: 14px; color: #94a3b8;">যেকোনো ৪-সংখ্যার পিন দিয়ে জয়েন করুন</p>
            <input type="number" id="room-pin" placeholder="৪-সংখ্যার পিন (যেমন: ২০২৬)">
            <input type="text" id="user-name" placeholder="আপনার নাম লিখুন">
            <button id="join-btn">জয়েন করুন</button>
            <p id="error-msg" style="color: #ef4444; margin-top: 10px; display: none;"></p>
        </div>

        <div id="chat-section" class="screen">
            <div class="chat-header">
                <h3>রুম পিন: <span id="display-pin"></span></h3>
                <button id="leave-btn">আউট</button>
            </div>
            <div class="chat-box" id="chat-box"></div>
            <div class="input-area">
                <input type="text" id="message-input" placeholder="মেসেজ লিখুন..." autocomplete="off">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
