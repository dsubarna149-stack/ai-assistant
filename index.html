<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raj - Pro AI Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="assistant-circle" id="mic-btn" title="ভয়েস কমান্ড চালু করতে ক্লিক করুন">
            <div class="pulse-ring"></div>
            <i class="fas fa-microphone"></i>
        </div>
        <h1 class="title">Raj AI</h1>
        <p class="status" id="status">মাইক আইকনে ক্লিক করুন অথবা নিচে টাইপ করুন...</p>
        
        <div class="chat-box" id="chat-box">
            <div class="message user-message" id="user-text">আপনার প্রশ্ন...</div>
            <div class="message ai-message" id="ai-text">Raj এর উত্তর...</div>
        </div>

        <div class="input-area">
            <input type="text" id="text-input" placeholder="Raj-কে কিছু লিখুন..." autocomplete="off">
            <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
