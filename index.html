<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raj - Pro AI Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="assistant-circle" id="mic-btn">
            <div class="pulse-ring"></div>
            <i class="fas fa-microphone"></i>
        </div>
        <h1 class="title">Raj AI</h1>
        <p class="status" id="status">সিস্টেম চালু করতে মাইকে ক্লিক করুন...</p>
        
        <div class="chat-box">
            <div class="message user-message" id="user-text">আপনার কথা এখানে দেখাবে...</div>
            <div class="message ai-message" id="ai-text">Raj এর উত্তর এখানে দেখাবে...</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
